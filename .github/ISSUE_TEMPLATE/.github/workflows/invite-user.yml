name: Invite Collaborator

on:
  issues:
    types: [opened]

jobs:
  invite:
    if: startsWith(github.event.issue.title, '[Access Request]')
    runs-on: ubuntu-latest
    steps:
      - name: Parse GitHub Username
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body;
            // Matches the label from your issue form
            const match = body.match(/### Your GitHub nickname\s+([^\s\r\n]+)/);
            if (match && match[1]) {
              core.setOutput('username', match[1].trim());
            } else {
              core.setFailed('Failed to extract GitHub username from issue body.');
            }

      - name: Invite to MFDS Repository
        run: |
          curl -L \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.INVITER_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/MykolaiKonyuhov/MFDS/collaborators/${{ steps.parse.outputs.username }} \
            -d '{"permission":"push"}'

      - name: Comment and Close Issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Invitation to MFDS repository has been successfully sent to @${{ steps.parse.outputs.username }}! Please check your email or GitHub notifications.`
            });
            github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            });
